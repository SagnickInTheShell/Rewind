app:
  data_dir: "data"               # relative to repo root
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:5174", "http://localhost:5175", "http://localhost:5176", "http://127.0.0.1:5174", "http://127.0.0.1:5175", "http://127.0.0.1:5176"]
  log_level: "INFO"
  blur_heads_in_exports: false
  max_upload_mb: 2048
  job_workers: 2
video:
  fps_processed: 5.0
  max_width: 1280
perception:
  yolo_model: "yolov8s.pt"
  yolo_conf: 0.25
  yolo_imgsz: 1280
  yolo_batch: 8
  detector: "auto"              # auto | yolo | blob  (auto: blob for synthetic top-down renders, else yolo)
  camera_view: "auto"           # auto | oblique | top_down (ground point = bbox bottom-centre or centre)
  person_radius_m: 0.25         # expected body radius, used to size blobs on top-down footage
  tracker: "bytetrack"          # or "deepsort"
  density_model_path: "data/models/csrnet.pth"
  density_fallback: "kde"       # used if weights missing
  kde_sigma_factor: 0.3         # KDE sigma = factor * bbox height
  density_min_threshold: 0.1    # persons/m² (coarse heat grid) below which flow samples are ignored
  hybrid_switch_density: 1.5    # p/m²: above this, trust density over detections
  hybrid_blend_band: 0.5        # linear blend width around switch point
  min_tracks_for_velocity: 3
  track_min_duration_s: 1.0
  track_max_speed: 4.0
  savgol_window: 5
  savgol_order: 2
  flow:
    method: "farneback"
    downscale: 0.5
    grid_step_px: 8
    max_samples_per_zone: 200   # flow vectors kept per zone per frame (seeded subsample)
overlay:
  heat_grid: [64, 36]           # cols, rows of the coarse density heatmap
  arrow_every: 6                # arrow every N flow grid cells
  tail_s: 3.0                   # track tail length shown in the overlay
features:
  window_s: 1.0
  direction_bins: 8
  counterflow_angle_deg: 120
  min_speed_for_direction: 0.1
  specific_flow_p_per_m_s: 1.3  # portal capacity per metre width (configurable literature default)
  smoothing_window: 5
risk:
  weights:                      # physics scorer weights, must sum to 1
    density: 0.25
    crowd_pressure: 0.25
    bottleneck_pressure: 0.20
    counterflow_index: 0.15
    flow_instability: 0.15
  norm:                         # value at which each feature saturates to 1.0
    density: 6.0
    crowd_pressure: 0.05
    bottleneck_pressure: 2.0
    counterflow_index: 0.6
    flow_instability: 1.0
  thresholds: {medium: 0.35, high: 0.55, critical: 0.75}
  hysteresis: 0.05
  min_dwell_s: 3.0
  ensemble: {physics: 0.5, temporal: 0.3, xgb: 0.2}
  escalation_horizon_s: 60
  density_levels: {caution: 2.0, high: 4.0, critical: 5.0}
  crowd_pressure_turbulence: 0.02
  occupancy_full_density: 1.0   # p/m²: motion-pattern features count fully from this density up
  occupancy_gated: [counterflow_index, flow_instability]
  temporal:
    arch: "tcn"                 # or "lstm"
    seq_len: 30
    tcn_channels: 64
    tcn_dilations: [1, 2, 4, 8]
    lstm_hidden: 64
    lstm_layers: 2
    dropout: 0.2
  models_dir: "data/models"
events:
  surge_baseline_s: 60
  surge_sigma: 2.0
  min_duration_s: 5.0
  density_slope_window_s: 20
  density_slope_threshold: 0.05
  bottleneck_threshold: 1.0
  counterflow_threshold: 0.25
  instability_norm_fraction: 0.5
  spillover_window_s: 30
  causal_max_dt_s: 90
  trend_window_s: 30
simulation:
  dt: 0.05
  record_hz: 10
  agent_radius_m: [0.22, 0.28]
  desired_speed: {mean: 1.34, std: 0.26}
  tau: 0.5
  A: 2000.0
  B: 0.08
  k_body: 120000.0
  kappa_friction: 240000.0
  mass: 80.0
  wall_A: 2000.0
  wall_B: 0.08
  reroute_every_s: 2.0
  reroute_prob: 0.3
  congestion_weight: 1.5
  max_agents: 3000
  hash_cell_m: 1.0
  local_density_radius_m: 1.0
  speed_cap_factor: 1.3
  open_reroute_radius_m: 30.0
  inflow_lookback_s: 30.0
  default_horizon_s: 240.0
  macro:
    dt: 0.5
    v_free: 1.34
    rho_jam: 5.4
    noise: 0.05
  max_parallel: 4
validation:
  good_rmse: 0.5
  fair_rmse: 1.0
  calib_fraction: 0.5
  calib_max_iter: 40
