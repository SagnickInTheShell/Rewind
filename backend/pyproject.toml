[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind"
version = "0.1.0"
description = "REWIND - AI Incident Reconstruction & Prevention Engine"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "opencv-python-headless>=4.9",
  "numpy>=1.26,<2.1",
  "scipy>=1.12",
  "ultralytics>=8.1",
  "supervision>=0.20,<0.31",
  "torch>=2.2",
  "torchvision>=0.17",
  "xgboost>=2.0",
  "scikit-learn>=1.4",
  "shap>=0.45",
  "networkx>=3.2",
  "shapely>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
perf = ["numba>=0.59"]
deepsort = ["deep-sort-realtime>=1.3"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-PyYAML",
  "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
include = ["rewind*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "N802", "N815", "RUF005", "RUF007", "RUF046", "RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_calls = false
disallow_any_generics = false
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "gpu: requires a CUDA GPU",
  "slow: long-running test",
  "models: requires downloaded model weights",
]
filterwarnings = ["ignore::DeprecationWarning"]
